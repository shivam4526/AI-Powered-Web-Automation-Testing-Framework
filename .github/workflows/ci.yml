name: brave-ui-api-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Brave Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate AI test cases
        run: |
          . .venv/bin/activate
          python ai_test_generator.py

      - name: Run Tests
        env:
          BRAVE_BINARY_PATH: /usr/bin/brave-browser
          HEADLESS: "true"
        run: |
          . .venv/bin/activate
          pytest --browser=brave --headless --html=reports/report.html --self-contained-html --alluredir=reports/allure-results
